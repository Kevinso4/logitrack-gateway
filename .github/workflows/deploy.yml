# CI/CD de gateway: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-gateway además despliega.
name: CI-CD gateway

on:
  push:
    branches: [main]
    paths: ["gateway/**", "common/**", "requirements.txt", "Dockerfile", ".github/workflows/deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["gateway/**", "common/**", "requirements.txt", "Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: gateway
      directorio: "."
      imagen: ghcr.io/kevinso4/logitrack-gateway
      desplegar: true
      url: https://tracklogi-gateway.onrender.com
      render-service-id: srv-daqqg449v7es73fo8o10
    secrets: inherit
